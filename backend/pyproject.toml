[project]
name = "faq-rag-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # Google Cloud / Vertex AI
    "google-cloud-aiplatform>=1.65.0",
    "google-cloud-storage>=2.18.0",
    "firebase-admin>=6.5.0",

    # Vector DB
    "qdrant-client>=1.11.0",

    # File parsing
    "pymupdf>=1.24.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.7.0",

    # RAG utils
    "rank-bm25>=0.2.2",

    # Config & utils
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
