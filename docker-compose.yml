services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: faqrag
      POSTGRES_USER: faqrag
      POSTGRES_PASSWORD: faqrag_local
    ports:
      - "5542:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
