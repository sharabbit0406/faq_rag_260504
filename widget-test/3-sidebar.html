<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試 3：側邊欄</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f8fafc;
      color: #1e293b;
    }

    /* ───── 主內容 ───── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 56px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      flex-shrink: 0;
    }
    .topbar-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #1d4ed8, #38bdf8);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 16px;
    }
    .topbar-title { font-weight: 700; font-size: 15px; color: #0f172a; }
    .topbar-subtitle { font-size: 12px; color: #94a3b8; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 28px;
      max-width: 680px;
      margin-bottom: 20px;
    }
    .product-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .product-name { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .product-desc { font-size: 14px; color: #64748b; line-height: 1.75; margin-bottom: 20px; }
    .product-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .spec-item { background: #f8fafc; border-radius: 10px; padding: 12px 14px; }
    .spec-label { font-size: 11px; color: #94a3b8; margin-bottom: 2px; font-weight: 500; }
    .spec-value { font-size: 13px; color: #1e293b; font-weight: 600; }

    .price-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 20px 28px;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .price-label { font-size: 13px; color: #64748b; }
    .price-value { font-size: 28px; font-weight: 800; color: #0f172a; }
    .price-unit { font-size: 13px; color: #94a3b8; font-weight: 400; }
    .btn-buy {
      background: linear-gradient(135deg, #1d4ed8, #38bdf8);
      color: white; border: none; border-radius: 10px;
      padding: 12px 28px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
    }
    .btn-buy:hover { opacity: 0.9; transform: translateY(-1px); }

    /* ───── 側邊欄容器（包含 tab + 面板） ───── */
    .sidebar-wrapper {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      flex-shrink: 0;
      position: relative;
    }

    /* 邊條 Tab 按鈕 */
    .sidebar-tab {
      width: 28px;
      background: white;
      border-left: 1px solid #e2e8f0;
      border-right: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
      z-index: 1;
    }
    .sidebar-tab:hover { background: #f1f5f9; }

    /* Tab 內的垂直標籤 */
    .sidebar-tab-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .sidebar-tab-icon {
      font-size: 15px;
      line-height: 1;
    }
    .sidebar-tab-label {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      writing-mode: vertical-lr;
      text-orientation: mixed;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .sidebar-tab-arrow {
      width: 16px;
      height: 16px;
      color: #94a3b8;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    /* 面板收起時箭頭朝左（提示可展開） */
    .sidebar-wrapper.collapsed .sidebar-tab-arrow {
      transform: rotate(180deg);
    }

    /* 客服面板 */
    .sidebar-panel {
      width: 360px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e2e8f0;
      background: white;
      overflow: hidden;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.25s ease;
      opacity: 1;
    }
    .sidebar-wrapper.collapsed .sidebar-panel {
      width: 0;
      opacity: 0;
      border-left-color: transparent;
    }

    .sidebar-panel iframe {
      flex: 1;
      border: none;
      width: 360px;
    }

    /* Tab 在展開狀態時高亮邊條 */
    .sidebar-wrapper:not(.collapsed) .sidebar-tab {
      border-left: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .sidebar-wrapper:not(.collapsed) .sidebar-tab-label {
      color: #1d4ed8;
    }
    .sidebar-wrapper:not(.collapsed) .sidebar-tab-icon {
      filter: none;
    }

    /* ── 測試標題列 ── */
    .test-banner {
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .test-badge {
      background: linear-gradient(135deg, #1d4ed8, #38bdf8);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .test-title { font-size: 13px; font-weight: 600; color: #1e40af; }
    .test-desc { font-size: 12px; color: #64748b; }
    .test-sep { color: #93c5fd; }
  </style>
</head>
<body>
  <!-- 主內容 -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-logo">✦</div>
      <div>
        <div class="topbar-title">商品詳情</div>
        <div class="topbar-subtitle">language APP</div>
      </div>
    </div>

    <div class="test-banner">
      <span class="test-badge">測試 3</span>
      <span class="test-title">側邊欄</span>
      <span class="test-sep">·</span>
      <span class="test-desc">點擊右側邊條 Tab 展開 / 收起客服面板，不遮擋主要內容，適合商品詳情頁</span>
    </div>

    <div class="content">
      <div class="product-card">
        <div class="product-badge">PREMIUM</div>
        <div class="product-name">AI 智慧客服系統</div>
        <div class="product-desc">
          基於 RAG 架構的多租戶智慧客服平台，支援 PDF、CSV、Excel、TXT 格式的知識庫建立。
          AI 只根據您上傳的資料回答，嚴格避免幻覺，並提供完整的來源引用。
        </div>
        <div class="product-specs">
          <div class="spec-item">
            <div class="spec-label">適合對象</div>
            <div class="spec-value">中小型電商、教育機構</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">支援格式</div>
            <div class="spec-value">PDF / CSV / Excel / TXT</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">核心技術</div>
            <div class="spec-value">Gemini 2.5 Flash + Qdrant</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">多輪對話</div>
            <div class="spec-value">支援，含查詢改寫</div>
          </div>
        </div>
      </div>

      <div class="price-card">
        <div>
          <div class="price-label">月費方案</div>
          <div class="price-value">NT$99 <span class="price-unit">/ 月</span></div>
        </div>
        <button class="btn-buy">立即購買</button>
      </div>
    </div>
  </div>

  <!-- 側邊欄（Tab + 面板） -->
  <div class="sidebar-wrapper" id="sidebar-wrapper">

    <!-- 邊條 Tab：點一下切換 -->
    <div class="sidebar-tab" id="sidebar-tab" title="開啟 / 收起客服">
      <div class="sidebar-tab-inner">
        <span class="sidebar-tab-icon">🤖</span>
        <span class="sidebar-tab-label">智慧客服</span>
        <!-- 箭頭 -->
        <svg class="sidebar-tab-arrow" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>

    <!-- 客服面板 -->
    <div class="sidebar-panel" id="sidebar-panel">
      <iframe src="http://localhost:3000/widget/202593e1-d375-4abc-a0d0-5d63da31b72b" title="客服助理"></iframe>
    </div>

  </div>

  <script>
    const wrapper = document.getElementById('sidebar-wrapper');
    const tab = document.getElementById('sidebar-tab');

    tab.addEventListener('click', () => {
      wrapper.classList.toggle('collapsed');
    });
  </script>
</body>
</html>
